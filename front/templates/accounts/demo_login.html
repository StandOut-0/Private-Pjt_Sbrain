{% extends 'base.html' %}
{% block title %}Demo Login — Second Brain{% endblock %}
{% block layout %}
<div class="sb-auth">
  <div class="sb-auth-card">
    <h1 class="h5 sb-auth-title mb-3">DEMO LOGIN</h1>
    <p class="text-secondary mb-4">체험용 인증 코드를 입력해주세요.</p>

    {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}

    <form method="post">
      {% csrf_token %}
      <input class="form-control text-center mb-3" name="code" placeholder="인증 코드 입력" autofocus>
      <button class="btn btn-primary w-100" type="submit">체험 시작하기</button>
    </form>

    <p class="text-secondary small mt-3 mb-1">※ 체험 계정은 일부 기능이 제한될 수 있습니다.</p>
    <p class="text-secondary small mb-3">데모 코드: <code>{{ demo_code }}</code></p>
    <a class="small" href="{% url 'accounts:login' %}">← 로그인으로 돌아가기</a>
  </div>
</div>
{% endblock %}
