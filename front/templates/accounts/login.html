{% extends 'base.html' %}
{% load static %}
{% block title %}Login — Second Brain{% endblock %}
{% block layout %}
<div class="sb-auth">
  <div class="sb-auth-card">
    <h1 class="sb-auth-title mb-4">
      <img class="sb-logo-full sb-logo-light" src="{% static 'img/logo/logo_dark_full.png' %}" alt="Second Brain — 또 다른 나를 만드는 개인 AI 업무 파트너">
      <img class="sb-logo-full sb-logo-dark" src="{% static 'img/logo/logo_light_full.png' %}" alt="Second Brain — 또 다른 나를 만드는 개인 AI 업무 파트너">
    </h1>

    <form method="post" data-sb-loading="로그인 중입니다...">
      {% csrf_token %}
      <button class="btn btn-outline-secondary w-100 mb-2" name="provider" value="google" type="submit">
        <i class="bi bi-google me-2"></i>Google로 로그인
      </button>
      <button class="btn btn-outline-secondary w-100" name="provider" value="google-admin" type="submit">
        <i class="bi bi-shield-lock me-2"></i>관리자로 로그인 (Face 인증)
      </button>
    </form>

    <div class="d-flex align-items-center gap-2 my-4 text-secondary small">
      <hr class="flex-grow-1"><span>또는</span><hr class="flex-grow-1">
    </div>

    <a class="btn btn-primary w-100" href="{% url 'accounts:demo_login' %}">체험 로그인</a>
    <p class="text-secondary small mt-3 mb-0">프로젝트를 직접 체험해보세요.</p>
  </div>
</div>
{% endblock %}
