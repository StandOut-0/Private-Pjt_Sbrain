<div class="modal fade" id="sb-settings-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">설정</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="sb-settings-section">화면</div>
        <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0">
          <label class="form-check-label" for="sb-dark-mode">다크 모드</label>
          <input class="form-check-input ms-0" type="checkbox" id="sb-dark-mode">
        </div>

        <div class="mt-3">
          <div class="mb-2">이미지 생성 품질</div>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input sb-image-quality" type="radio" name="image-quality" id="quality-low" value="low">
              <label class="form-check-label" for="quality-low">낮음</label>
            </div>
            <div class="form-check">
              <input class="form-check-input sb-image-quality" type="radio" name="image-quality" id="quality-mid" value="mid" checked>
              <label class="form-check-label" for="quality-mid">중간</label>
            </div>
            <div class="form-check">
              <input class="form-check-input sb-image-quality" type="radio" name="image-quality" id="quality-high" value="high">
              <label class="form-check-label" for="quality-high">높음</label>
            </div>
          </div>
        </div>

        <div class="sb-settings-section mt-4">알림</div>
        <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0">
          <label class="form-check-label" for="sb-notify-project">프로젝트 작업 완료</label>
          <input class="form-check-input ms-0 sb-notify" type="checkbox" id="sb-notify-project" checked>
        </div>
        <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0">
          <label class="form-check-label" for="sb-notify-agent">Agent 작업 완료</label>
          <input class="form-check-input ms-0 sb-notify" type="checkbox" id="sb-notify-agent" checked>
        </div>
        <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0">
          <label class="form-check-label" for="sb-notify-error">오류 발생</label>
          <input class="form-check-input ms-0 sb-notify" type="checkbox" id="sb-notify-error" checked>
        </div>
        <p class="text-secondary small mt-3 mb-0">※ 알림은 화면 내 Toast로 표시됩니다.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>
