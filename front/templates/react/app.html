{% load static %}
<!doctype html><html lang="ko" data-bs-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Second Brain</title><link rel="icon" href="{% static 'img/logo/favicon.svg' %}"><link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="{% static 'css/app.css' %}"><link rel="stylesheet" href="{% static 'css/responsive-nav.css' %}"><link rel="stylesheet" href="{% static 'css/screen-tour.css' %}">{% for name in page_styles %}<link rel="stylesheet" href="{% static 'css/' %}{{ name }}.css">{% endfor %}{% for css in assets.css %}<link rel="stylesheet" href="{{ css }}">{% endfor %}<script>document.documentElement.dataset.sbPage='{{ page }}';</script></head><body class="sb-body">{% csrf_token %}{{ sb_react_data|json_script:'sb-react-data' }}<div id="root"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{% static 'js/app.js' %}"></script><script src="{% static 'js/screen-tour.js' %}"></script>{% for script in page_scripts %}<script src="{% static 'js/' %}{{ script }}"></script>{% endfor %}{% if assets.js %}<script type="module" src="{{ assets.js }}"></script>{% endif %}</body></html>
